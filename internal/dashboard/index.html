<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download Monitor</title>
<style>
:root{color-scheme:dark;--bg:#070b13;--panel:#101827;--line:#26344a;--muted:#8fa7c8;--text:#f5f8ff;--cyan:#49d6ff;--green:#43e0a2;--blue:#7187ff;--track:#2a374c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132039 0,transparent 30%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:26px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:14px;align-items:center}.logo{display:grid;place-items:center;width:44px;height:44px;border:1px solid #365174;border-radius:12px;background:#101c2f;color:var(--cyan);font-size:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--cyan)}h1{font-size:23px;margin:4px 0 0}.live{color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.job{background:rgba(16,24,39,.94);border:1px solid var(--line);border-radius:16px}.metric{padding:17px}.metric-head{display:flex;justify-content:space-between;color:#80a3d1;font-size:12px}.metric-value{font-size:29px;font-weight:800;margin:15px 0 8px}.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .35s ease}.sub{font-size:12px;color:var(--muted);margin-top:6px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 10px}.section-head h2{font-size:16px}.updated{color:#82a6d7;font-size:12px}.jobs{display:grid;gap:12px}.job-head{display:grid;grid-template-columns:1fr 170px;gap:20px;padding:18px;border-bottom:1px solid var(--line)}.slug{font-size:17px;font-weight:800}.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;color:#82a6d7;font-size:11px}.overall{text-align:right}.overall strong{font-size:23px}.overall .bar{margin-top:8px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0 28px;padding:14px 18px 18px}.step{display:grid;grid-template-columns:130px 1fr 42px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #202d40}.step-name{white-space:nowrap}.step-pct{text-align:right}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#63748f;margin-right:8px}.step.processing .status-dot{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.step.completed .status-dot{background:var(--green)}.step.completed .fill{background:var(--green)}.empty{padding:44px;text-align:center;color:var(--muted)}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.job-head{grid-template-columns:1fr}.overall{text-align:left}}@media(max-width:540px){.wrap{padding:14px}.metrics{grid-template-columns:1fr}.step{grid-template-columns:112px 1fr 38px}.header{align-items:flex-start}.live{margin-top:12px}}
</style>
</head>
<body><main class="wrap">
<header class="header"><div class="brand"><div class="logo">⇩</div><div><div class="eyebrow">REALTIME WORKER</div><h1>Download Monitor</h1></div></div><div class="live"><span class="dot" id="liveDot"></span><span id="liveText">Connecting</span></div></header>
<section class="metrics">
 <article class="card metric"><div class="metric-head"><span>GPU</span><span id="gpuTop">—</span></div><div class="metric-value" id="gpuValue">N/A</div><div class="bar"><div class="fill" id="gpuBar"></div></div><div class="sub" id="gpuSub">NVIDIA GPU not detected</div></article>
 <article class="card metric"><div class="metric-head"><span>NVENC</span><span id="vramTop">—</span></div><div class="metric-value" id="nvencValue">N/A</div><div class="bar"><div class="fill" id="nvencBar"></div></div><div class="sub" id="nvencSub">Encoder utilization</div></article>
 <article class="card metric"><div class="metric-head"><span>CPU</span><span id="cpuCores">—</span></div><div class="metric-value" id="cpuValue">—</div><div class="bar"><div class="fill" id="cpuBar"></div></div><div class="sub">System utilization</div></article>
 <article class="card metric"><div class="metric-head"><span>MEMORY</span><span id="memTop">—</span></div><div class="metric-value" id="memValue">—</div><div class="bar"><div class="fill" id="memBar"></div></div><div class="sub">Used / Total</div></article>
 <article class="card metric"><div class="metric-head"><span>DISK</span><span id="diskTop">—</span></div><div class="metric-value" id="diskValue">—</div><div class="bar"><div class="fill" id="diskBar"></div></div><div class="sub">Storage usage</div></article>
 <article class="card metric"><div class="metric-head"><span>DISK I/O</span><span>Realtime</span></div><div class="metric-value" id="ioValue">↓ — &nbsp; ↑ —</div><div class="bar"><div class="fill" style="width:9%"></div></div><div class="sub">Read / Write per second</div></article>
</section>
<div class="section-head"><h2>Active jobs</h2><div class="updated" id="updated">Waiting for data</div></div><section class="jobs" id="jobs"><div class="job empty">No active download jobs</div></section>
</main>
<script>
const $=id=>document.getElementById(id), clamp=n=>Math.max(0,Math.min(100,Number(n)||0));
const bytes=n=>{n=Number(n)||0;if(n<1024)return n.toFixed(0)+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n>=10?1:2)+' '+u[i]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function metric(id,value){$(id+'Value').textContent=value.toFixed(1)+'%';$(id+'Bar').style.width=clamp(value)+'%'}
function render(s){
 const m=s.system||{},cpu=m.cpu||{},mem=m.memory||{},disk=m.disk||{},gpu=(m.gpus||[])[0];if(gpu){metric('gpu',gpu.gpuPercent||0);$('gpuTop').textContent=(gpu.temperature||0)+'°C · '+(gpu.powerWatts||0).toFixed(0)+'W';$('gpuSub').textContent=gpu.name||'NVIDIA GPU';metric('nvenc',gpu.encoderPercent||0);$('vramTop').textContent=bytes(gpu.memoryUsed)+' / '+bytes(gpu.memoryTotal);$('nvencSub').textContent='Decoder '+(gpu.decoderPercent||0).toFixed(0)+'%'}else{$('gpuValue').textContent='N/A';$('gpuBar').style.width='0';$('gpuTop').textContent='—';$('gpuSub').textContent='NVIDIA GPU not detected';$('nvencValue').textContent='N/A';$('nvencBar').style.width='0';$('vramTop').textContent='—'}metric('cpu',cpu.percent||0);$('cpuCores').textContent=(cpu.cores||0)+' threads';metric('mem',mem.percent||0);$('memTop').textContent=bytes(mem.used)+' / '+bytes(mem.total);metric('disk',disk.percent||0);$('diskTop').textContent=bytes(disk.used)+' / '+bytes(disk.total);$('ioValue').innerHTML='<span style="color:var(--cyan)">↓ '+bytes(disk.readBytesPerSecond)+'/s</span> &nbsp; <span style="color:#ffb45e">↑ '+bytes(disk.writeBytesPerSecond)+'/s</span>';
 const jobs=s.jobs||[];$('updated').textContent=jobs.length+' running · updated '+new Date(s.timestamp).toLocaleTimeString();$('jobs').innerHTML=jobs.length?jobs.map(job=>`<article class="job"><div class="job-head"><div><div class="slug">${esc(job.slug||job.id)}</div><div class="meta"><span>${esc(job.workerId)}</span><span>Job ${esc(job.id)}</span><span>File ${esc(job.fileId)}</span>${job.sourceType?`<span>Source ${esc(job.sourceType)}</span>`:''}</div></div><div class="overall"><strong>${clamp(job.overallPercent).toFixed(1)}%</strong><div class="bar"><div class="fill" style="width:${clamp(job.overallPercent)}%"></div></div></div></div><div class="steps">${(job.steps||[]).map(step=>`<div class="step ${esc(step.status)}"><div class="step-name"><span class="status-dot"></span>${esc(step.label)}</div><div class="bar"><div class="fill" style="width:${clamp(step.percent)}%"></div></div><div class="step-pct">${Math.round(clamp(step.percent))}%</div></div>`).join('')}</div></article>`).join(''):'<div class="job empty">No active download jobs</div>';
}
const events=new EventSource('/events');events.onopen=()=>{$('liveText').textContent='Live';$('liveDot').style.background='var(--green)'};events.onmessage=e=>{try{render(JSON.parse(e.data))}catch(_){}};events.onerror=()=>{$('liveText').textContent='Reconnecting';$('liveDot').style.background='#ffb45e'};
</script></body></html>
